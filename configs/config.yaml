# Central configuration. Paths are relative to the PROJECT ROOT
# (run all scripts from the project root, e.g. `python src/train_offline.py`).

nasa_cmapss:
  # https://www.kaggle.com/datasets/bishals098/nasa-turbofan-engine-degradation-simulation
  train_file: "data/nasa_cmapss/train_FD001.txt"
  test_file: "data/nasa_cmapss/test_FD001.txt"
  rul_file: "data/nasa_cmapss/RUL_FD001.txt"
  columns:
    - unit_id
    - cycle
    - op_setting_1
    - op_setting_2
    - op_setting_3
    - sensor_1
    - sensor_2
    - sensor_3
    - sensor_4
    - sensor_5
    - sensor_6
    - sensor_7
    - sensor_8
    - sensor_9
    - sensor_10
    - sensor_11
    - sensor_12
    - sensor_13
    - sensor_14
    - sensor_15
    - sensor_16
    - sensor_17
    - sensor_18
    - sensor_19
    - sensor_20
    - sensor_21
  # Near-constant columns in FD001, commonly dropped in the literature
  drop_columns: [op_setting_3, sensor_1, sensor_5, sensor_6, sensor_10, sensor_16, sensor_18, sensor_19]
  id_column: unit_id
  time_column: cycle
  # Final N cycles of each test unit's trajectory are labeled anomalous
  anomaly_horizon_cycles: 30

swat:
  # https://www.kaggle.com/datasets/vishala28/swat-dataset-secure-water-treatment-system
  normal_file: "data/swat/SWaT_Dataset_Normal_v1.csv"
  attack_file: "data/swat/SWaT_Dataset_Attack_v0.csv"
  timestamp_column: "Timestamp"
  label_column: "Normal/Attack"
  normal_label: "Normal"
  # SWaT is ~500k rows at 1Hz. Downsample by taking every Nth row to keep
  # memory and runtime tractable on a normal machine. Set to 1 to disable.
  row_subsample: 5

preprocessing:
  window_size: 30
  # IMPORTANT: stride 1 on SWaT produces ~500k windows (many GB). Use a
  # stride >= window_size for SWaT, or rely on max_*_windows caps below.
  window_stride: 1
  swat_window_stride: 10      # stride override used when --dataset swat
  val_split: 0.1
  # Hard caps on how many windows are held in memory at once. Windows are
  # subsampled evenly (not randomly truncated) so coverage stays uniform.
  max_train_windows: 20000
  max_test_windows: 20000

autoencoder:
  type: lstm                  # lstm | dense
  hidden_dim: 64
  latent_dim: 16
  num_layers: 2
  dropout: 0.2
  epochs: 30
  batch_size: 128
  learning_rate: 0.001
  early_stopping_patience: 5

fast_backend:
  stl_period: 30              # seasonal period for STL
  dmd_rank: 10                # SVD truncation rank for DMD
  # Number of windows sampled when fitting STL/DMD. These are closed-form
  # fits; a few thousand windows is ample and keeps the SVD tractable.
  fit_sample_windows: 2000

scoring:
  # combined = alpha * error_z + (1 - alpha) * harmonic_mean_distance_z
  alpha: 0.5
  threshold_percentile: 99.5
  n_centroids: 8
  # Vectors sampled when fitting reference centroids (k-means).
  centroid_fit_samples: 20000

sla:
  target_latency_ms: 20
